[package]
name = "slintlu"
description = "Build complete Wayland desktop shells (bars, docks, launchers, overlays …) in the Slint language"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/LunaDash-DE/SlintLu"
license = "GPL-3.0-only"
keywords = ["wayland", "slint", "desktop-shell", "layer-shell", "gui"]
categories = ["gui"]

[[bin]]
name = "slintlu"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime", "opengl", "vulkan"]
## The `slintlu` executable: loads shells written in the Slint language at runtime.
runtime = ["slint/gettext", "dep:slint-interpreter", "dep:clap", "dep:env_logger", "dep:notify", "dep:pollster"]
## FemtoVG on OpenGL ES through EGL (libEGL is loaded at runtime).
opengl = ["slint/renderer-femtovg", "dep:khronos-egl", "dep:wayland-egl"]
## FemtoVG on wgpu with the Vulkan backend.
vulkan = ["slint/renderer-femtovg-wgpu", "slint/unstable-wgpu-30", "dep:wgpu", "dep:raw-window-handle", "dep:pollster"]

[dependencies]
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon", "system"] }
wayland-client = { version = "0.31", features = ["system"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }

khronos-egl = { version = "6", features = ["dynamic"], optional = true }
wayland-egl = { version = "0.32", optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "1.0", optional = true }

slint-interpreter = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "display-diagnostics"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
env_logger = { version = "0.11", optional = true }
notify = { version = "8", default-features = false, optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
