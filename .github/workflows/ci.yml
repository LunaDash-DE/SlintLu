name: CI

# CI only builds. Formatting, lints, tests and headless runs are local (`just ci`,
# `just headless`); run them before pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Libraries Slint and smithay-client-toolkit link against.
  BUILD_PACKAGES: pkg-config libwayland-dev libxkbcommon-dev libfontconfig-dev libpam0g-dev

jobs:
  build:
    name: Build (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # `1.92` is the minimum supported Rust version declared in Cargo.toml.
        toolchain: [stable, "1.92"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.BUILD_PACKAGES }}
          version: build-2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # Dependency cache: ~/.cargo registry/git + compiled dependencies in target/.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --release
      - name: Build without GPU renderers
        run: cargo build --locked --release --no-default-features

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Caches the Nix store between runs (GitHub Actions cache, no account needed).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - name: Build the package
        run: scripts/annotate.sh "nix build" nix build -L .#slintlu
